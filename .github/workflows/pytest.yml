name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Diagnose checkout state
        run: |
          echo "HEAD commit:"
          git rev-parse HEAD
          echo "Branch/ref:"
          git branch --show-current
          echo "scorer.py lines 38-48:"
          sed -n '38,48p' src/models/scorer.py
          echo "Any other scorer.py in repo:"
          find . -name "scorer.py" -not -path "./.git/*"

      - name: Run test suite
        run: python -m pytest --tb=short -q
